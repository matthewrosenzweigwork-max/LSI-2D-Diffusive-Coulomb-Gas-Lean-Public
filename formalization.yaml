project:
  name: Uniform logarithmic Sobolev inequalities for the two-dimensional Coulomb gas at the diffusive
    temperature scale
  description: Logarithmic Sobolev inequalities for the original labeled two-dimensional repulsive
    Coulomb Gibbs law at the diffusive temperature scale, on its full closed smooth-core form domain.
    The fixed-positive-temperature rate is independent of particle count and observable. A single
    positive rate also works for every temperature in a fixed positive compact interval and every
    particle count N >= 2. The Challenge fixes the literal Gibbs law, energy and closed form domain;
    selected rate definitions are witness holes whose Solution values are the original constructed
    rates. Supporting construction theorems and rate positivity are compared explicitly.
  authors:
  - Matthew Rosenzweig
  responsible_maintainers:
  - Matthew Rosenzweig
