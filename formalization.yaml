known_gaps: Four selected positive witness functions retain dependence only on the fixed temperature,
  compact temperature interval or total-exponent bound as appropriate. Their actual original Solution
  constructions are checked, but their literal internal choice/thermal-reference formulas are not
  fixed in the Challenge. Weighted Cwt and RhoWt formulas and their confinement scaling are fixed
  exactly. No sharpness formula, higher-order thermal derivative-tail clause, or labeled LSI uniformity
  down to zero temperature is attributed to this entry. Historical manuscript reviews are qualified
  and do not certify every inherited prose argument.
