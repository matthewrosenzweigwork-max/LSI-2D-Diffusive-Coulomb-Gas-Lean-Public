project:
  name: Uniform logarithmic Sobolev inequalities for the two-dimensional Coulomb gas at the diffusive
    temperature scale
  description: Logarithmic Sobolev inequalities for the original labeled two-dimensional repulsive
    Coulomb Gibbs law at the diffusive temperature scale on its full closed smooth-core form domain,
    with positive rates uniform in particle count and locally uniform over positive compact temperature
    intervals. The second main result gives Poincare and logarithmic Sobolev inequalities for planar
    Gaussian laws weighted by arbitrary finite products of nonnegative powers of point distances,
    uniformly in point count, locations and individual exponents under a total-exponent bound. Exact
    confinement scaling and common constants for confinement bounded below are included. The Challenge
    fixes both physical laws, full closed domains, energies and all selected statements. Four positive
    rate/constant witness functions receive their values from the original Solution constructions;
    supporting construction and normalization theorems are compared explicitly.
  authors:
  - Matthew Rosenzweig
  responsible_maintainers:
  - Matthew Rosenzweig
